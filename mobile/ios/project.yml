name: IntegrationMonitor
options:
  bundleIdPrefix: com.integrations
  deploymentTarget:
    iOS: "17.0"
targets:
  IntegrationMonitor:
    type: application
    platform: iOS
    sources:
      - IntegrationMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.integrations.monitor
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
