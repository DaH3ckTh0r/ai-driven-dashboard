<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integration monitor</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; color: #1b1b1b; }
  #list { width: 300px; border-right: 1px solid #ddd; overflow-y: auto; }
  #thread { flex: 1; display: flex; flex-direction: column; }
  .finding { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
  .finding.active { background: #eef4ff; }
  .sev { font-size: 12px; font-weight: 600; text-transform: uppercase; }
  .sev-critical, .sev-high { color: #b00020; } .sev-medium { color: #b26a00; } .sev-low { color: #555; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 8px 0; padding: 10px 12px; border-radius: 8px; background: #f4f4f4; max-width: 720px; white-space: pre-wrap; }
  .msg.user { background: #e3f2e3; margin-left: auto; }
  .msg.system { background: #fff8e1; font-size: 13px; }
  .meta { font-size: 12px; color: #666; margin-bottom: 4px; }
  .actions button { margin-right: 8px; padding: 6px 12px; cursor: pointer; }
  .status { font-size: 12px; color: #444; margin-top: 6px; }
  #signin { padding: 16px; } #error { color: #b00020; padding: 8px 16px; }
</style>
</head>
<body>
<div id="list"><div id="signin"></div><div id="findings"></div></div>
<div id="thread">
  <div id="error" hidden></div>
  <div id="messages"><p>Select an issue to see the agent's findings.</p></div>
</div>
<script>
"use strict";
let activeId = null;

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "className") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

function showError(message) {
  const box = document.getElementById("error");
  box.textContent = message;
  box.hidden = !message;
}

async function api(path, options = {}) {
  const init = { credentials: "same-origin", ...options };
  if (options.body !== undefined) {
    init.headers = { "content-type": "application/json" };
    init.body = JSON.stringify(options.body);
  }
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    document.getElementById("signin").textContent = "Sign in to see and approve agent actions.";
    throw new Error("sign in required");
  }
  if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
  return data;
}

async function loadFindings() {
  const findings = await api("/api/findings?status=open");
  const box = document.getElementById("findings");
  box.replaceChildren(...findings.map((f) =>
    el("div", {
      className: "finding" + (f.id === activeId ? " active" : ""),
      onclick: () => openFinding(f.id),
    }, [
      el("div", { className: `sev sev-${f.severity}`, text: `${f.severity} · ${f.kind}` }),
      el("div", { text: f.monitorName }),
      el("div", { className: "status", text: `${f.integrationId} · ${new Date(f.observedAt).toLocaleString()}` }),
    ]),
  ));
  if (findings.length === 0) box.append(el("p", { text: "No open issues.", className: "finding" }));
}

async function openFinding(id) {
  activeId = id;
  const data = await api(`/api/findings/${encodeURIComponent(id)}`);
  const approvals = new Map(data.approvals.map((a) => [a.id, a]));
  const messages = document.getElementById("messages");
  messages.replaceChildren(...data.messages.map((m) => renderMessage(m, approvals)));
  messages.lastElementChild?.scrollIntoView();
  await loadFindings();
}

function renderMessage(m, approvals) {
  const children = [el("div", { className: "meta", text: `${m.author} · ${new Date(m.at).toLocaleTimeString()}` }),
    el("div", { text: m.text })];
  if (m.approvalId && approvals.has(m.approvalId)) {
    const a = approvals.get(m.approvalId);
    children.push(el("div", { className: "status", text: `approval ${a.id}: ${a.status}` }));
    if (a.status === "pending") {
      children.push(el("div", { className: "actions" }, [
        el("button", { text: "Dry run", onclick: () => act(a.id, "dry-run") }),
        el("button", { text: "Approve and run", onclick: () => act(a.id, "approve") }),
        el("button", { text: "Reject", onclick: () => act(a.id, "reject") }),
      ]));
    }
  }
  const role = m.role === "user" ? "user" : m.role === "system" ? "system" : "agent";
  return el("div", { className: `msg ${role}` }, children);
}

async function act(approvalId, verb) {
  const body = verb === "reject" ? { reason: window.prompt("Reason for rejecting (optional)") || undefined } : {};
  if (verb === "approve" && !window.confirm("Run this action now? It will change data.")) return;
  try {
    showError("");
    await api(`/api/approvals/${encodeURIComponent(approvalId)}/${verb}`, { method: "POST", body });
    if (activeId) await openFinding(activeId);
  } catch (err) {
    showError(err.message);
  }
}

loadFindings().catch((err) => showError(err.message));
setInterval(() => {
  loadFindings().catch(() => undefined);
  if (activeId) openFinding(activeId).catch(() => undefined);
}, 5000);
</script>
</body>
</html>
